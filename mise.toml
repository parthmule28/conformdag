[tools]
python = "3.12"
uv = "0.12.0"
node = "26.5.1"
"npm:@fission-ai/openspec" = { version = "1.7.0", trust_policy_excludes = ["fastq@1.20.2"] }
"pipx:ruff" = "0.12.10"
"npm:pyright" = "1.1.403"
"pipx:pip-audit" = "2.9.0"
"aqua:gitleaks" = "8.28.0"

[tasks.setup]
description = "Create the locked development environment"
run = "uv sync --all-groups"

[tasks.lint]
description = "Run Ruff lint checks"
run = "uv run ruff check ."

[tasks."format-check"]
description = "Verify Ruff formatting"
run = "uv run ruff format --check ."

[tasks.format]
description = "Format Python sources"
run = "uv run ruff format ."

[tasks.typecheck]
description = "Run strict Pyright checks"
run = "uv run pyright"

[tasks.test]
description = "Run fast tests"
run = "uv run pytest -m 'not runtime'"

[tasks."test:coverage"]
description = "Run core tests with the 90 percent coverage gate"
run = "uv run pytest -m 'not runtime' --cov=conformdag --cov-report=term-missing --cov-fail-under=90"

[tasks."test:runtime"]
description = "Run Docker/Airflow runtime tests"
run = "uv run pytest -m runtime"

[tasks."test:runtime-smoke"]
description = "Build and execute the selected real Docker/Airflow runtime profile"
run = "uv run python scripts/runtime_smoke.py"

[tasks.build]
description = "Build wheel and source distribution"
run = "uv build"

[tasks."ui-build"]
description = "Build the platform dashboard SPA into the package static directory"
run = "cd frontend && npm install --no-fund --no-audit && npm run build"

[tasks."ui-check"]
description = "Typecheck the platform dashboard frontend"
run = "cd frontend && npm run build"

[tasks.schema]
description = "Verify checked-in JSON Schemas"
run = "uv run python scripts/export_schemas.py --check"

[tasks."schema:update"]
description = "Regenerate checked-in JSON Schemas"
run = "uv run python scripts/export_schemas.py"

[tasks."scan:example"]
description = "Scan the checked-in example repository"
run = "uv run conformdag scan --path examples/sample-repository --policy-pack policies/pack.yaml"

[tasks."scan:community-example"]
description = "Scan the sample repository with the bundled community policy pack"
run = "uv run conformdag scan --path examples/sample-repository --policy-pack community"

[tasks."validate:packs"]
description = "Validate the organizational and bundled community policy packs"
run = "uv run conformdag validate-policies --path policies/pack.yaml && uv run conformdag validate-policies --path community"

[tasks."scan:semantic-example"]
description = "Run the opt-in provider-backed example scan"
run = "uv run conformdag scan --path examples/sample-repository --policy-pack policies/pack.yaml --semantic --semantic-base-url $CONFORMDAG_SEMANTIC_BASE_URL --semantic-model $CONFORMDAG_SEMANTIC_MODEL --semantic-structured-output"

[tasks.benchmark]
description = "Run the public benchmark"
run = "uv run conformdag benchmark benchmarks/synthetic --policy-pack policies/pack.yaml"

[tasks.security]
description = "Run dependency and secret checks"
run = "uv run pip-audit && gitleaks detect --source . --redact"

[tasks.privacy]
description = "Check generated artifacts for secrets and raw semantic I/O"
run = "uv run python scripts/verify_artifact_privacy.py"

[tasks."image-scan"]
description = "Scan a runtime image with Docker Scout"
run = "docker scout cves $CONFORMDAG_IMAGE"

[tasks.check]
description = "Run the default local quality gate"
depends = ["format-check", "lint", "typecheck", "test", "validate:packs"]
