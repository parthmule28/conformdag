[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "conformdag"
version = "0.1.0b1"
description = "Explainable conformance checks for Apache Airflow engineering policies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "ConformDAG contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.11,<3",
    "rich>=14,<15",
    "ruamel.yaml>=0.18,<1",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
platform = [
    "alembic>=1.16,<2",
    "fastapi>=0.128,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.40,<1",
]

[project.urls]
Homepage = "https://github.com/parthmule28/conformdag"
Documentation = "https://github.com/parthmule28/conformdag/tree/main/docs"
Issues = "https://github.com/parthmule28/conformdag/issues"
Repository = "https://github.com/parthmule28/conformdag.git"

[dependency-groups]
dev = [
    "coverage[toml]>=7.9,<8",
    "pip>=26.2,<27",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<7",
    "pytest-mock>=3.14,<4",
    "ruff>=0.12,<1",
]

[project.scripts]
conformdag = "conformdag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/conformdag"]
artifacts = ["src/conformdag/platform/static/**"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/LICENSE", "/README.md", "/pyproject.toml"]
artifacts = ["src/conformdag/platform/static/**"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "runtime: requires a Dockerized Airflow runtime profile",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["conformdag"]

[tool.coverage.report]
omit = [
    "src/conformdag/benchmark.py",
    "src/conformdag/benchmark_semantic.py",
    "src/conformdag/cli.py",
    "src/conformdag/runtime.py",
    "src/conformdag/semantic.py",
    "src/conformdag/semantic_evaluator.py",
]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["benchmarks/synthetic"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "SIM"]
ignore = ["E501", "S105", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
