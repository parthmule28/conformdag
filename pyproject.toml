[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "conformdag"
version = "0.1.0b1"
description = "Explainable conformance checks for Apache Airflow engineering policies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "ConformDAG contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.11,<3",
    "rich>=14,<15",
    "ruamel.yaml>=0.18,<1",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
runtime = ["docker>=7,<8"]

[dependency-groups]
dev = [
    "coverage[toml]>=7.9,<8",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<7",
    "pytest-mock>=3.14,<4",
    "ruff>=0.12,<1",
]

[project.scripts]
conformdag = "conformdag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/conformdag"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "runtime: requires a Dockerized Airflow runtime profile",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["conformdag"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["benchmarks/synthetic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S105", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
