name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
      - run: mise run check
      - run: mise run scan:community-example
      - run: mise run privacy

  frontend-e2e:
    name: Browser journeys (Playwright)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: cd frontend && npm run typecheck:e2e
      - run: cd frontend && npm run build
      - run: cd frontend && npm run e2e
        env:
          CONFORMDAG_PLATFORM_TOKEN: secret-token

  benchmark:
    name: Offline benchmark gate
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
      - run: mise run benchmark
      - run: mise run privacy

  release-validation:
    name: Release validation
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
      - run: mise run test:coverage
      - run: mise run schema
      - run: mise run inventory
      - run: mise run build
      - run: mise run security

  host-macos:
    name: macOS host CLI and source analysis
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
      - run: mise run check
      - run: mise run scan:example
      - run: mise run scan:community-example

  runtime:
    name: Airflow runtime profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        profile: ["3.3.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
      - run: mise run test:runtime
        env:
          CONFORMDAG_RUNTIME_PROFILE: ${{ matrix.profile }}
      - run: mise run test:runtime-smoke
        env:
          CONFORMDAG_RUNTIME_PROFILE: ${{ matrix.profile }}

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          # Fixed ephemeral credential for this loopback-only test container; TEST ONLY, NOT DEPLOYMENT.
          POSTGRES_PASSWORD: c26-ephemeral-postgres-test-only
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
      - name: Configure PostgreSQL test DSN
        env:
          # Fixed ephemeral credential for this loopback-only test container; TEST ONLY, NOT DEPLOYMENT.
          POSTGRES_SUPERUSER_PASSWORD: c26-ephemeral-postgres-test-only
        run: |
          uv run python - <<'PY'
          import os

          import psycopg
          from psycopg import sql
          from sqlalchemy.engine import URL

          username = "conformdag_c26_test"
          password = os.environ["POSTGRES_SUPERUSER_PASSWORD"]
          with psycopg.connect(
              host="127.0.0.1",
              port=5432,
              dbname="postgres",
              user="postgres",
              password=password,
              autocommit=True,
          ) as connection:
              connection.execute(
                  sql.SQL("CREATE ROLE {} WITH LOGIN CREATEDB PASSWORD {}").format(
                      sql.Identifier(username), sql.Literal(password)
                  )
              )

          dsn = URL.create(
              "postgresql+psycopg",
              username=username,
              password=password,
              host="127.0.0.1",
              port=5432,
              database="postgres",
          ).render_as_string(hide_password=False)
          print(f"::add-mask::{dsn}", flush=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              github_env.write(f"CONFORMDAG_TEST_POSTGRES_DSN={dsn}\n")
          PY
      - name: PostgreSQL integration suite (first run)
        run: mise run test:postgres
      - name: PostgreSQL integration suite (repeat run)
        run: mise run test:postgres
      - name: Verify PostgreSQL test cleanup
        if: ${{ always() }}
        env:
          # Fixed ephemeral credential for this loopback-only test container; TEST ONLY, NOT DEPLOYMENT.
          POSTGRES_SUPERUSER_PASSWORD: c26-ephemeral-postgres-test-only
        run: |
          uv run python - <<'PY'
          import os

          import psycopg

          prefix = "conformdag_c26_"
          with psycopg.connect(
              host="127.0.0.1",
              port=5432,
              dbname="postgres",
              user="postgres",
              password=os.environ["POSTGRES_SUPERUSER_PASSWORD"],
              options="-c default_transaction_read_only=on -c statement_timeout=5000",
          ) as connection:
              database_count, backend_count = connection.execute(
                  """
                  SELECT
                      (SELECT count(*) FROM pg_database WHERE left(datname, length(%s)) = %s),
                      (SELECT count(*) FROM pg_stat_activity
                       WHERE datname IS NOT NULL AND left(datname, length(%s)) = %s)
                  """,
                  (prefix, prefix, prefix, prefix),
              ).fetchone()

          if database_count or backend_count:
              raise SystemExit(
                  "PostgreSQL test cleanup left "
                  f"{database_count} owned database(s) and {backend_count} backend(s)."
              )
          print("PostgreSQL test cleanup left zero owned databases and zero matching backends.")
          PY

  semantic-smoke:
    name: Semantic provider smoke (opt-in)
    if: ${{ vars.CONFORMDAG_RUN_SEMANTIC_SMOKE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
      - name: Run an explicit provider-backed scan
        run: mise run scan:semantic-example
        env:
          CONFORMDAG_MODEL_API_KEY: ${{ secrets.CONFORMDAG_MODEL_API_KEY }}
          CONFORMDAG_SEMANTIC_BASE_URL: ${{ vars.CONFORMDAG_SEMANTIC_BASE_URL }}
          CONFORMDAG_SEMANTIC_MODEL: ${{ vars.CONFORMDAG_SEMANTIC_MODEL }}
