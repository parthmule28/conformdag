name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
      - run: mise run check
      - run: mise run privacy

  benchmark:
    name: Offline benchmark gate
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
      - run: mise run benchmark
      - run: mise run privacy

  release-validation:
    name: Release validation
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
      - run: mise run test:coverage
      - run: mise run schema
      - run: mise run build
      - run: mise run security

  host-macos:
    name: macOS host CLI and source analysis
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
      - run: mise run check
      - run: mise run scan:example

  runtime:
    name: Airflow runtime profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        profile: ["3.3.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
      - run: mise run test:runtime
        env:
          CONFORMDAG_RUNTIME_PROFILE: ${{ matrix.profile }}
      - run: mise run test:runtime-smoke
        env:
          CONFORMDAG_RUNTIME_PROFILE: ${{ matrix.profile }}

  semantic-smoke:
    name: Semantic provider smoke (opt-in)
    if: ${{ vars.CONFORMDAG_RUN_SEMANTIC_SMOKE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
      - name: Run an explicit provider-backed scan
        run: mise run scan:semantic-example
        env:
          CONFORMDAG_MODEL_API_KEY: ${{ secrets.CONFORMDAG_MODEL_API_KEY }}
          CONFORMDAG_SEMANTIC_BASE_URL: ${{ vars.CONFORMDAG_SEMANTIC_BASE_URL }}
          CONFORMDAG_SEMANTIC_MODEL: ${{ vars.CONFORMDAG_SEMANTIC_MODEL }}
