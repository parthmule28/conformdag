name: Release

on:
  push:
    tags:
      - "v0.1.0-beta.1"

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

jobs:
  package:
    name: Build and attest Python distributions
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run setup
      - run: mise run build
      - name: Generate distribution checksums
        run: sha256sum dist/* | tee dist/SHA256SUMS
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: conformdag-python-distributions
          path: dist/
      - name: Attest distributions
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  runtime-images:
    name: Build and scan Airflow ${{ matrix.profile }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: "2.11.2"
            dockerfile: runtime/airflow-2.11.2/Dockerfile
          - profile: "3.3.0"
            dockerfile: runtime/airflow-3.3.0/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image with SBOM and provenance
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}/airflow-${{ matrix.profile }}:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - name: Scan published image
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ghcr.io/${{ github.repository }}/airflow-${{ matrix.profile }}:${{ github.ref_name }}
          only-severities: critical,high
          exit-code: true
          sarif-file: scout-${{ matrix.profile }}.sarif
      - name: Upload vulnerability results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-vulnerability-results-${{ matrix.profile }}
          path: scout-${{ matrix.profile }}.sarif
          if-no-files-found: warn
